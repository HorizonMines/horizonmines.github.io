<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>HorizonMines</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="images/websitelogo.ico">

  <meta property="og:title" content="HorizonMines.net">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/background.webp">
  <meta property="og:image:type" content="image/webp">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="800">
  <meta name="theme-color" content="#080b0a">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="stage">
    <div class="content">
      <h1 class="wordmark">HorizonMines</h1>

      <section class="connect" aria-label="Server addresses">
        <button class="row" type="button" data-copy="HorizonMines.net">
          <img class="block" src="images/block-grass.png" alt="" width="300" height="300">
          <span class="plat">Java</span>
          <span class="addr">
            <span class="ad">HorizonMines.net</span>
          </span>
          <span class="hint" aria-hidden="true">copy</span>
        </button>

        <button class="row" type="button" data-copy="bedrock.horizonmines.net">
          <img class="block" src="images/block-bedrock.png" alt="" width="300" height="300">
          <span class="plat">Bedrock</span>
          <span class="addr">
            <span class="ad">bedrock.HorizonMines.net</span>
          </span>
          <span class="hint" aria-hidden="true">copy</span>
        </button>
      </section>

      <nav class="links" aria-label="Community links">
        <a href="https://discord.gg/hfKU95mZ3B">Discord</a>
        <a href="https://docs.google.com/document/d/1SXTZSW4kaCaUk4uNAjI6Ds-gQRi6k-7Fsdfe8dz2acg">Documentation</a>
        <a href="https://horizonmines.tebex.io/">Store</a>
      </nav>
    </div>

    <p class="disclaimer">We are not affiliated with Mojang Studios or Microsoft.</p>
  </main>

  <span class="visually-hidden" role="status" aria-live="polite" id="copy-status"></span>

  <script src="main.js" defer></script>
</body>

</html>
